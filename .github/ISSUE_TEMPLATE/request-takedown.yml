name: Request a takedown
description: Content rights holders or project authors requesting removal of an entry
title: "[Takedown] "
labels: ["wontfix"]
body:
  - type: markdown
    attributes:
      value: |
        OpenPortsGames catalogs native port projects and links only to official
        sources. It does not host or link to downloadable files. If you are a
        rights holder or the author of a project listed here and want an entry
        removed, tell us and we will act promptly. See the legal page for the
        takedown policy.
  - type: input
    id: entry
    attributes:
      label: Entry to remove
      description: Name of the port / slug of the page.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Rights holder or authorized representative
        - Project author
        - Other
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Concise, factual. Legal requests may include a case/claim number.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I confirm I am authorized to request this removal.
          required: true
