name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to the same commit SHA as ci.yml and catalog-update.yml so
        # all three workflows are consistent. The earlier "Unable to resolve
        # action ... unable to find version" failure for this SHA was
        # transient: CI workflows resolved the exact same reference on the
        # same push. If resolution flakes again here, re-run the failed job
        # (the actions resolver is eventually consistent); do not fall back
        # to a moving tag.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate catalog content
        run: npm run validate

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://kymie131.github.io/openportsgames
          NEXT_PUBLIC_BASE_PATH: /openportsgames
          NEXT_PUBLIC_SUPPORT_PAYPAL_URL: https://www.paypal.com/donate/?hosted_button_id=5WK2PSB9MV4GW

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
