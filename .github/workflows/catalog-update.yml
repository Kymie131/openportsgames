name: Catalog update check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for stale catalog entries
    runs-on: ubuntu-24.04
    permissions:
      # Minimal permissions for this job: write stars content via the commit
      # step and open issues for stale ports. The built-in GITHUB_TOKEN
      # (github.token) is used throughout -- no personal access token.
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_SITE_URL is a stub here; it is only used for metadata.
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://openportsgames.example

      - name: Compare latest releases
        id: check
        run: node scripts/check-latest-releases.mjs

      - name: Commit star counts
        if: steps.check.outputs.stars_changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/github-stars.ts
          git commit -m "chore(data): refresh GitHub star counts"
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open issue for stale ports
        if: steps.check.outputs.stale == '1'
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Catalog update needed" \
            --body "$(cat catalog-check-report.md)" \
            --label "data"
        env:
          GH_TOKEN: ${{ github.token }}
